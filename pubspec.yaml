name: mobile
description: A private, offline, gentle urge-interruption ritual.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  # drift capped <2.33: stacked_generator 1.6.2 constrains sqlite3 <3.0.0
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  flutter_local_notifications: ^22.0.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  flutter_background_service: ^5.1.0
  installed_apps: ^2.1.1
  intl: ^0.20.3


dev_dependencies:
  build_runner: ^2.4.5
  drift_dev: ^2.30.0
  sqlite3: ^2.4.6 # test-only: load a host libsqlite3 for in-memory drift tests
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.4
  fake_async: ^1.3.1 # test-only: deterministic Timer control for the breath countdown ticker

flutter:
  uses-material-design: true
  # Bundled as assets (never runtime google_fonts) — the app is fully offline.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic-Light.ttf
          weight: 300
          style: italic
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

